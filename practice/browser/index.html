<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cofa Browser 연습</title>
  <link rel="icon" href="data:,">
  <style>
    :root { font-family: system-ui, sans-serif; color: #182438; background: #f0f4f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; }
    main { max-width: 680px; margin: auto; padding: 32px; border: 1px solid #d4dce6;
      border-radius: 16px; background: white; box-shadow: 0 12px 36px #1824380a; }
    .badge { display: inline-block; color: #176649; background: #e7f5ee;
      padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    h1 { font-size: 28px; margin: 18px 0 8px; }
    p { line-height: 1.6; }
    .muted { color: #526278; }
    label[for="task"] { display: block; margin-bottom: 8px; font-weight: 650; }
    .entry { display: flex; gap: 8px; }
    input[type="text"] { min-width: 0; flex: 1; padding: 12px;
      font: inherit; border: 1px solid #8797ab; border-radius: 8px; }
    button { cursor: pointer; font: inherit; font-weight: 650; padding: 11px 16px;
      border: 1px solid #2554c7; border-radius: 8px; color: white; background: #2554c7; }
    button:hover { filter: brightness(.93); }
    button.secondary { color: #34445a; background: white; border-color: #aab6c5; }
    :focus-visible { outline: 3px solid #efae3c; outline-offset: 3px; }
    #message { min-height: 1.6em; margin: 8px 0; color: #9c361e; font-size: 14px; }
    #summary { font-weight: 650; }
    ul { padding: 0; margin: 16px 0 24px; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 14px 0;
      border-bottom: 1px solid #e1e7ef; }
    li label { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: #2554c7; }
    li span { overflow-wrap: anywhere; }
    li.done span { text-decoration: line-through; color: #64748b; }
    li button { padding: 7px 10px; font-size: 14px; flex-shrink: 0; }
    footer { margin-top: 24px; border-top: 1px solid #e1e7ef; padding-top: 16px; }
    #connection { display: block; overflow-wrap: anywhere; font-size: 12px; }
    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      main { padding: 22px 16px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">BROWSER PRACTICE · v1</span>
    <h1>작업 환경 체크리스트</h1>
    <p class="muted">항목 추가, 완료, 삭제와 새로고침을 직접 확인하세요.</p>
    <noscript>이 연습의 버튼을 사용하려면 브라우저의 JavaScript가 필요합니다.</noscript>
    <form id="task-form">
      <label for="task">새 확인 항목</label>
      <div class="entry">
        <input id="task" type="text" maxlength="120" autocomplete="off"
          placeholder="예: 터미널에서 파일 저장 확인" aria-describedby="message">
        <button type="submit">추가</button>
      </div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p id="summary" aria-live="polite"></p>
    <ul id="tasks" aria-label="확인 항목"></ul>
    <button id="reset" type="button" class="secondary">연습 초기화</button>
    <footer class="muted">
      <p>이 페이지의 연습 항목만 브라우저에 저장합니다. 외부 요청은 보내지 않습니다.</p>
      <code id="connection"></code>
    </footer>
  </main>
  <script>
    'use strict';
    const STORAGE_KEY = 'cofa-browser-practice-v1';
    const initialTasks = () => [
      { text: '서버와 Browser 연결 확인', done: false },
      { text: '버튼과 새로고침 확인', done: false }
    ];
    const input = document.querySelector('#task');
    const list = document.querySelector('#tasks');
    const message = document.querySelector('#message');
    let storageWarning = '';
    let tasks = initialTasks();
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed) || !parsed.every(item => item &&
            typeof item.text === 'string' && item.text.trim().length > 0 &&
            item.text.length <= 120 && typeof item.done === 'boolean')) {
          throw new Error('Invalid practice data');
        }
        tasks = parsed.map(({ text, done }) => ({ text, done }));
      }
    } catch {
      storageWarning = '저장된 데이터를 읽지 못해 초기 상태로 시작합니다.';
    }

    function render() {
      list.replaceChildren();
      tasks.forEach((task, index) => {
        const row = document.createElement('li');
        row.classList.toggle('done', task.done);
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          update();
        });
        const text = document.createElement('span');
        text.textContent = task.text;
        label.append(checkbox, text);
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'secondary';
        remove.textContent = '삭제';
        remove.setAttribute('aria-label', `${task.text} 삭제`);
        remove.addEventListener('click', () => {
          tasks.splice(index, 1);
          update();
        });
        row.append(label, remove);
        list.append(row);
      });
      const done = tasks.filter(task => task.done).length;
      document.querySelector('#summary').textContent =
        `전체 ${tasks.length} · 완료 ${done} · 남음 ${tasks.length - done}`;
    }

    function update() {
      input.removeAttribute('aria-invalid');
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        storageWarning = '';
      } catch {
        storageWarning = '브라우저 저장이 차단되었습니다. 새로고침하면 변경이 사라질 수 있습니다.';
      }
      message.textContent = storageWarning;
      render();
    }

    document.querySelector('#task-form').addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.setAttribute('aria-invalid', 'true');
        message.textContent = '공백이 아닌 확인 항목을 입력하세요.';
        input.focus();
        return;
      }
      tasks.push({ text, done: false });
      input.value = '';
      update();
      input.focus();
    });
    document.querySelector('#reset').addEventListener('click', () => {
      tasks = initialTasks();
      input.value = '';
      update();
    });
    document.querySelector('#connection').textContent =
      `연결 주소: ${location.origin}${location.pathname}`;
    message.textContent = storageWarning;
    render();
  </script>
</body>
</html>
